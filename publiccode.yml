description:
  de:
    localisedName: Kopexa Schutzbedarfsanalyse
    shortDescription: >-
      Schutzbedarfsanalyse nach BSI-Standard 200-2 und ISO/IEC 27001 im Browser –
      offline, ohne Konto, barrierefrei, mit Export als PDF, Excel und ODS.
    longDescription: >
      Die Kopexa Schutzbedarfsanalyse führt Sicherheitsverantwortliche Schritt für
      Schritt durch die Schutzbedarfsfeststellung für Vertraulichkeit, Integrität und
      Verfügbarkeit nach der Methodik des BSI-Standards 200-2. Sie ersetzt fehleranfällige
      Excel-Bögen durch einen geführten Fragebogen mit Maximumprinzip, begründeten
      Sondereffekten (Kumulation, Verteilung, Vererbung), Plausibilitätsprüfung,
      Versionierung und feldgenauem Änderungsprotokoll.


      Alle Daten bleiben ausschließlich im Browser (IndexedDB); es werden keine Inhalte an
      Server übertragen. Die Anwendung ist eine installierbare Progressive Web App, läuft
      vollständig offline und ist nach WCAG 2.2 AA geprüft. Berichte entstehen als PDF, als
      Excel-Datei (XLSX) und als OpenDocument-Tabelle (ODS) für LibreOffice, Collabora und
      openDesk. Bestehende Erhebungsbögen sowie Asset-Listen aus CSV, XLSX und ODS lassen
      sich importieren; Schwellenwerte des Bewertungsschemas sind je Organisation
      konfigurierbar.


      **Anwendung:** [schutzbedarf.kopexa.com](https://schutzbedarf.kopexa.com/)


      **Entwickelt von:** [Kopexa GmbH](https://kopexa.com/de?utm_source=opencode&utm_medium=registry&utm_campaign=sba),
      GRC-Plattform für Informationssicherheit, Datenschutz und Compliance


      **Quellcode:** [github.com/kopexa-grc/sba](https://github.com/kopexa-grc/sba) (Hauptrepository,
      Issues und Pull Requests) · Spiegel auf openCode
    documentation: "https://schutzbedarf.kopexa.com/hilfe"
    features:
      - Geführte Schutzbedarfsfeststellung nach BSI-Standard 200-2
      - Maximumprinzip und begründete Übersteuerung
      - Konfigurierbares Bewertungsschema je Organisation
      - Versionierung, Änderungsprotokoll und Versionsvergleich
      - Berichte als PDF, XLSX und ODS (OpenDocument)
      - Import von Erhebungsbögen und Asset-Listen (CSV, XLSX, ODS)
      - Offline-fähig, Daten nur im Browser, barrierefrei (WCAG 2.2 AA)

