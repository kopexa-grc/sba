name: Dependabot auto-merge

# Merges a Dependabot PR once "CI & Deploy" (typecheck, unit, build, e2e) has
# passed on it. Failing updates stay open for a human.
on:
  workflow_run:
    workflows: ["CI & Deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge if the tested commit is still the PR head
        run: |
          pr=$(gh pr view "$BRANCH" -R "$GITHUB_REPOSITORY" --json number,headRefOid,author,state \
            --jq 'select(.state == "OPEN" and (.author.login | test("dependabot"))) | "\(.number) \(.headRefOid)"')
          read -r number head <<<"$pr"
          if [ -z "$number" ] || [ "$head" != "$TESTED_SHA" ]; then
            echo "Nothing to merge (closed, not Dependabot, or newer commits pending)."
            exit 0
          fi
          gh pr merge "$number" -R "$GITHUB_REPOSITORY" --squash --delete-branch
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
